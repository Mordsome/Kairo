name: Build

# Builds both jars (Kairo and Kairo Void) on every push and pull request, so anyone can check that the
# source builds. Releases are made by hand on the Releases page with the tested jars.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: kairo-jars
          path: build/libs/*.jar
