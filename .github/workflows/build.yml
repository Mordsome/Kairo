name: Build

# Builds both jars (Kairo and Kairo Void) on every push and pull request.
# A release (both jars + SHA256SUMS.txt, text from docs/release-notes/v<version>.md) is published either by pushing a
# version tag like v0.2.0, or from the Actions tab: Build -> Run workflow -> tick "Publish a release". The version is
# mod_version in gradle.properties. The in-game updater reads that release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the mod_version in gradle.properties
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Collect the jars
        run: |
          mkdir -p dist
          cp build/libs/kairo-[0-9]*.jar build/libs/kairo-void-[0-9]*.jar dist/
          rm -f dist/*-sources.jar
          (cd dist && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-jars
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kairo-jars
          path: dist

      - name: Check the version and release notes
        id: ver
        run: |
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match mod_version ${VERSION} in gradle.properties"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} is already released. Bump mod_version in gradle.properties first."; exit 1
          fi
          if [ ! -f "docs/release-notes/${TAG}.md" ]; then echo "Missing docs/release-notes/${TAG}.md"; exit 1; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kairo ${{ steps.ver.outputs.tag }}
          body_path: docs/release-notes/${{ steps.ver.outputs.tag }}.md
          files: dist/*
