# Decompiling Minecraft (genSources) needs a bit of headroom.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties, checked against the official 26.3 template (fabric-example-mod, branch 26.3)
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Sodium is a required dependency that the player installs separately.
# This version is only used on the dev runtime classpath (./gradlew runClient). It is never bundled.
sodium_version=mc26.3-0.9.2-fabric

# Mod properties
mod_version=0.3.0
maven_group=dev.mordo.kairo
archives_base_name=kairo
